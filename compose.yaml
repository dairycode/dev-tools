services:
  dev-tools:
    image: ${DEV_TOOLS_IMAGE:-dev-tools:local}
    build:
      context: .
    networks:
      - app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  app:
    name: ${DOCKER_NETWORK_NAME:-shared-network}
    driver: bridge
