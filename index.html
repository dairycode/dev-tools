<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="本地处理的开发者工具箱：URL、Base64、Hash、时间戳、二维码和 JSON，不上传输入数据。"
    />
    <meta name="color-scheme" content="light dark" />
    <title>开发工具包</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      ;(function () {
        var preference = null
        try {
          preference = localStorage.getItem('dev-tools-theme')
        } catch (_) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>开发工具包需要启用 JavaScript，所有转换仅在你的浏览器内进行。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
